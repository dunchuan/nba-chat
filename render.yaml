services:
  - type: web
    name: nba-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MODEL_NAME
        value: qwen3.7-plus
      - key: MODEL_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: REACT_MAX_STEPS
        value: "12"
      - key: LANGGRAPH_RECURSION_LIMIT
        value: "40"
      - key: NATIVE_MAX_COMPLETION_TOKENS
        value: "6000"
      - key: SQLITE_PATH
        value: ./data/nba_chat.sqlite3
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_PROJECT
        value: nba-chat
      - key: LANGSMITH_API_KEY
        sync: false
