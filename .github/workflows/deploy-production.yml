name: Deploy Production - NBA Chat

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-chat-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Vultr
        env:
          DEPLOY_HOST: ${{ vars.VULTR_HOST }}
          DEPLOY_USER: ${{ vars.VULTR_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/nba-chat
          git checkout main
          git pull --ff-only origin main
          docker compose up -d --build --remove-orphans

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo
              echo "Deployment succeeded."
              exit 0
            fi
            sleep 2
          done

          docker compose ps
          docker compose logs --tail=100 nba-chat
          exit 1
          REMOTE
