<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="由 FastAPI 与 LangGraph 驱动的轻量 AI Agent 演示" />
    <title>Pocket Agent · 随时展开思路</title>
    <link rel="stylesheet" href="/assets/styles.css?v=8" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Pocket Agent 首页">
          <span class="brand-mark">P</span>
          <span>Pocket Agent</span>
        </a>
        <div class="status"><span class="status-dot" id="status-dot"></span><span id="status-text">连接中</span></div>
      </header>

      <main class="workspace">
        <section class="intro" id="intro">
          <p class="eyebrow">FASTAPI × LANGGRAPH</p>
          <h1>把一个问题，<br /><em>慢慢想清楚。</em></h1>
          <p class="lede">一个会使用工具、保留当前会话上下文的轻量 Agent。试着问它一个问题，或让它查询某地时间。</p>
          <div class="suggestions" aria-label="问题建议">
            <button data-prompt="现在上海几点？">现在上海几点？</button>
            <button data-prompt="用三个要点解释什么是 LangGraph。">解释 LangGraph</button>
            <button data-prompt="帮我制定一个学习 FastAPI 的 7 天计划。">制定学习计划</button>
          </div>
        </section>

        <section class="chat" id="chat" aria-live="polite" aria-label="对话记录"></section>
      </main>

      <footer class="composer-wrap">
        <form class="composer" id="chat-form">
          <label class="sr-only" for="message">输入消息</label>
          <textarea id="message" rows="1" maxlength="8000" placeholder="输入你想探索的问题…" required></textarea>
          <button class="send" id="send" type="submit" aria-label="发送消息">↑</button>
        </form>
        <div class="footer-row">
          <span>演示服务器休眠后，Agent 记忆会被清除</span>
          <button id="new-chat" type="button">新对话</button>
        </div>
      </footer>
    </div>
    <script src="/assets/app.js?v=8" defer></script>
  </body>
</html>
